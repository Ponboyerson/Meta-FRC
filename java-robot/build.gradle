plugins {
    id "java"
    id "edu.wpi.first.GradleRIO" version "2025.3.1"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def ROBOT_MAIN_CLASS = "frc.robot.Main"

// Define the targets
wpilib {
    desktopPlatforms.addAll("linuxx86-64", "linuxathena")
}

// Simulation configuration
sim {
    addJavaDebuggingServer = true
    simLibDir = "${WPILIB_SIM_DIR}"
    nativeDebugLibs = []
    javaDebugLibs = []
    guiPlatforms.addAll("linuxx86-64")
}

// Maven repositories
repositories {
    mavenCentral()
    maven { url = "https://maven.pkg.github.com/Mechanical-Advantage/AdvantageKit" }
    maven { url = "https://maven.photonvision.org/repository/internal" }
    maven { url = "https://maven.photonvision.org/repository/snapshots" }
}

dependencies {
    // WPILib dependencies
    implementation wpi.deps.wpilib()
    nativeZip wpi.deps.nativeZip(getWpilibPlatform())
    nativeDesktopZip wpi.deps.nativeDesktop(getWpilibPlatform())
    
    // Simulation dependencies
    simulation wpi.deps.sim.gui(getWpilibPlatform(), true)
    simulation wpi.deps.sim.client(getWpilibPlatform(), true)
    
    // NetworkTables 4 client for QuestNav
    implementation "us.hebi.quickbuf:quickbuf-runtime:1.3.3"
    implementation "com.google.protobuf:protobuf-java:3.25.1"
    
    // PhotonVision dependencies
    implementation "org.photonvision:photonlib-java:2025.3.1"
    
    // AdvantageKit (optional, for logging)
    implementation "org.littletonrobotics.akit:akit-java:2025.1.0"
    
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.main.java.srcDirs = ['src/main/java']
sourceSets.main.resources.srcDirs = ['src/main/deploy']

test {
    useJUnitPlatform()
}

wrapper {
    gradleVersion = '8.5'
}
